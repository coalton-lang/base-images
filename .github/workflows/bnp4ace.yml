name: Build and publish _port_ images

on:
  pull_request:

  workflow_dispatch: {}

  push:
    branches:
      - porting2abcl,ecl,clasp

jobs:
  build-and-publish-images:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # commented out since they're built already
        LISP_IMPLEMENTATION: [ "abcl", "ecl",
				"clasp" ]

    steps:
      - uses: actions/checkout@v4
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish the Docker image
        run: |
               docker build ${{ matrix.LISP_IMPLEMENTATION }} --tag ghcr.io/c-kloukinas/${{ matrix.LISP_IMPLEMENTATION }}-port:latest
               docker push ghcr.io/c-kloukinas/${{ matrix.LISP_IMPLEMENTATION }}-port:latest
